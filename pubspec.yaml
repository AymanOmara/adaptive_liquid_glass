name: adaptive_liquid_glass
description: >-
  iOS 26 Liquid Glass for Flutter, measured against SwiftUI, with Material 3
  counterparts on Android behind one API.

version: 0.1.2

homepage: https://pub.dev/packages/adaptive_liquid_glass

screenshots:
  - description: Components on a plain background in light mode (iOS 26.4).
    path: screenshots/ios-components-plain-light.png
  - description: Components on a plain background in dark mode (iOS 26.4).
    path: screenshots/ios-components-plain-dark.png
  - description: Adaptive Liquid Glass components on iOS 26.4 in light mode.
    path: screenshots/ios-components-light.png
  - description: Adaptive Liquid Glass components on iOS 26.4 in dark mode.
    path: screenshots/ios-components-dark.png

topics:
  - liquid-glass
  - cupertino
  - material
  - ui
  - shader

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # Dart only: Android renders Material 3 and has no native code.
      android:
        dartPluginClass: AdaptiveLiquidGlassAndroid
        dartFileName: src/platform/adaptive_liquid_glass_android.dart

      ios:
        pluginClass: AdaptiveLiquidGlassPlugin

  shaders:
    - shaders/liquid_glass.frag
    - shaders/progressive_blur.frag
    - shaders/tab_lens_content.frag
